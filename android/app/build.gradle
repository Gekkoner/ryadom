plugins { id 'com.android.application' }
android {
    namespace 'app.ryadom.messenger'
    compileSdk 35
    defaultConfig {
        applicationId 'app.ryadom.messenger'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '0.1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '1') + '-beta'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { applicationIdSuffix '.beta' } }
}
