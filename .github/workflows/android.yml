name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-build
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Keep beta signing key for subsequent builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ryadom-beta-signing-v1
      - name: Build and check APK
        working-directory: android
        run: gradle --no-daemon assembleDebug lintDebug
      - name: Prepare download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ryadom-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose ryadom-android.apk
          sha256sum ryadom-android.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ryadom-android
          path: |
            ryadom-android.apk
            SHA256SUMS.txt
          retention-days: 90
      - name: Publish beta APK
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          gh release create "android-beta-${BUILD_NUMBER}" ryadom-android.apk SHA256SUMS.txt --target "$BUILD_SHA" --title "Рядом Android · beta ${BUILD_NUMBER}" --prerelease --notes "Установочная beta-версия для Android 8+. Вход по нику и паролю. Камера, микрофон, кружки и файлы используют рабочий сайт. Это тестовая APK-сборка; фоновые push-уведомления пока не реализованы."
